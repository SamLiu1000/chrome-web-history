# 部署配置模板
# 1. 运行 `wrangler d1 create onetap-sync`，把输出的 database_id 填到下面
# 2. 真实 database_id 保存在根目录 private/wrangler.toml（已 gitignore，勿提交）
#    部署: cd worker && wrangler deploy --config ../private/wrangler.toml

name = "d1-sync"
main = "src/worker.js"
compatibility_date = "2024-09-01"

[[d1_databases]]
binding = "DB"
database_name = "onetap-sync-apac"
database_id = "<你的database_id>"
